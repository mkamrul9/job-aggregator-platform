          type: integer
        high_watermark:
          type: integer
        lag:
          type: integer

    AuditLogEntry:
      type: object
      required: [id, actor_id, action, target_resource, timestamp, outcome]
      properties:
        id:
          type: string
          format: uuid
        actor_id:
          type: string
        action:
          type: string
        target_resource:
          type: string
        timestamp:
          type: string
          format: date-time
        outcome:
          type: string
          enum: [SUCCESS, FAILURE]
        details:
          type: object

    ErrorResponse:
      type: object
      required: [code, message, correlation_id]
      properties:
        code:
          type: string
          description: Machine-readable uppercase error identifier.
        message:
          type: string
          description: Human-readable error explanation.
        detail:
          type: string
        correlation_id:
          type: string
          format: uuid
        errors:
          type: array
          items:
            type: object
            required: [field, issue]
            properties:
              field:
                type: string
