          type: number
        currency:
          type: string
        pay_period:
          type: string
        sort:
          type: string
        alerts_enabled:
          type: boolean
        alert_frequency:
          type: string

    UpdateSavedSearchRequest:
      type: object
      properties:
        name:
          type: string
        query:
          type: string
        location:
          type: string
        remote_eligibility:
          type: string
        seniority:
          type: string
        job_type:
          type: string
        min_salary:
          type: number
        currency:
          type: string
        pay_period:
          type: string
        sort:
          type: string
        alerts_enabled:
          type: boolean
        alert_frequency:
          type: string

    TrackedApplication:
      type: object
      required: [id, job_id, status, applied_at]
      properties:
        id:
          type: string
          format: uuid
        job_id:
          type: string
          format: uuid
        job_summary:
          $ref: '#/components/schemas/JobSummary'
        status:
          type: string
          enum: [APPLIED, INTERVIEWING, OFFERED, REJECTED, WITHDRAWN]
        notes:
          type: string
        applied_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateApplicationRequest:
      type: object
      required: [job_id, status]
      properties:
        job_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [APPLIED, INTERVIEWING, OFFERED, REJECTED, WITHDRAWN]
        notes:
          type: string

    UpdateApplicationRequest:
      type: object
      properties:
        status:
          type: string
          enum: [APPLIED, INTERVIEWING, OFFERED, REJECTED, WITHDRAWN]
        notes:
          type: string

    AlertSubscription:
      type: object
      required: [id, query, frequency, active]
      properties:
        id:
          type: string
          format: uuid
        query:
          type: string
        location:
          type: string
        frequency:
          type: string
          enum: [IMMEDIATE, DAILY, WEEKLY]
        active:
          type: boolean
        created_at:
          type: string
          format: date-time

    CreateAlertRequest:
      type: object
      required: [query, frequency]
      properties:
        query:
          type: string
        location:
          type: string
        frequency:
          type: string
          enum: [IMMEDIATE, DAILY, WEEKLY]

    CreateReportRequest:
      type: object
      required: [report_type, description]
      properties:
        job_id:
          type: string
          format: uuid
        report_type:
          type: string
          enum: [EXPIRED_LISTING, BROKEN_LINK, INCORRECT_DATA, SPAM, OTHER]
        description:
          type: string
        contact_email:
          type: string
          format: email

    ReportResponse:
      type: object
      required: [report_id, status, message]
      properties:
        report_id:
          type: string
          format: uuid
        status:
          type: string
