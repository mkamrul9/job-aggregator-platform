# docker-compose.staging.yml
# Seekers Reproducible Staging Environment (P14)
# Private network boundaries: datastores & broker are isolated without host port exposure.
# Ingress is exclusively routed through the authenticated, rate-limited Nginx API Gateway.

services:
  api-gateway:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - microservices-net
    restart: unless-stopped
    depends_on:
      - frontend-next
      - frontend-admin
      - ingestion-service
      - user-service
      - notification-service
      - resume-api
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  scraper-service:
    build:
      context: ./service-scraper
      dockerfile: Dockerfile
    environment:
      - KAFKA_BROKER=kafka:9092
      - SCHEDULER_CHECKPOINT_DIR=/app/data/scheduler
      - STATE_DIR=/app/data/scheduler
    volumes:
      - scraper_data:/app/data/scheduler
    networks:
      - microservices-net
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy

  job-mongo:
    image: mongo:7.0-jammy
    # No host port exposed in staging/production for private data protection
    volumes:
      - mongo_data:/data/db
    networks:
      - microservices-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  user-postgres:
    image: postgres:15-alpine
    # No host port exposed in staging/production for private data protection
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-staging_secure_password_p14}
      POSTGRES_DB: ${POSTGRES_DB:-job_aggregator_users}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - microservices-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-job_aggregator_users}"]
      interval: 10s
      timeout: 5s
      retries: 5

  user-service:
    build:
      context: ./service-user
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-staging_secure_password_p14}@user-postgres:5432/${POSTGRES_DB:-job_aggregator_users}?schema=public
      - RESUME_GRPC_URL=resume-grpc:50051
      - OBJECT_STORAGE_DIR=/app/data/storage
      - JWT_SECRET=${JWT_SECRET:-staging_jwt_secret_p14_do_not_use_in_prod}
    volumes:
      - ./shared-protos:/shared-protos:ro
      - user_storage:/app/data/storage
      - shared_uploads:/uploads
    networks:
      - microservices-net
    restart: unless-stopped
    depends_on:
      user-postgres:
        condition: service_healthy
      resume-grpc:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/users/health', (r) => { if (r.statusCode !== 200) process.exit(1); }).on('error', () => process.exit(1));"]
      interval: 10s
      timeout: 5s
      retries: 3

  resume-api:
    build:
      context: ./service-resume
      dockerfile: Dockerfile
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
    networks:
      - microservices-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  resume-grpc:
    build:
      context: ./service-resume
      dockerfile: Dockerfile
    command: ["python", "grpc_server.py"]
    volumes:
      - shared_uploads:/uploads
    networks:
      - microservices-net
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.8.0
    # No host port exposed in staging/production
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      - KAFKA_NUM_PARTITIONS=1
    volumes:
      - kafka_data:/tmp/kafka-logs
    networks:
      - microservices-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5

  ingestion-service:
    build:
      context: ./service-ingestion
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=production
      - KAFKA_BROKER=kafka:9092
      - MONGO_URI=mongodb://job-mongo:27017
      - ES_NODE=http://elasticsearch:9200
      - ADMIN_TOKEN_SECRET=${ADMIN_TOKEN_SECRET:-staging_admin_token_secret_p14_long_and_secure}
      - INGESTION_ADMIN_KEY=${ADMIN_TOKEN_SECRET:-staging_admin_token_secret_p14_long_and_secure}
      - INTERNAL_SERVICE_KEY=${ADMIN_TOKEN_SECRET:-staging_admin_token_secret_p14_long_and_secure}
    networks:
      - microservices-net
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      job-mongo:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/health', (r) => { if (r.statusCode !== 200) process.exit(1); }).on('error', () => process.exit(1));"]
      interval: 10s
      timeout: 5s
      retries: 3

  notification-service:
    build:
      context: ./service-notification
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=production
      - KAFKA_BROKER=kafka:9092
      - NOTIFICATION_MODE=CAPTURE
      - SOCKET_CORS_ORIGIN=http://localhost:4200,http://localhost:3003
      - NOTIFICATIONS_STORE_PATH=/app/data/notifications_store.json
      - SUPPRESSION_STORE_PATH=/app/data/notifications_store.json
    volumes:
      - notification_data:/app/data
    networks:
      - microservices-net
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/health', (r) => { if (r.statusCode !== 200) process.exit(1); }).on('error', () => process.exit(1));"]
      interval: 10s
      timeout: 5s
      retries: 3

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.10.2
    # No host port exposed in staging/production
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    volumes:
      - elastic_data:/usr/share/elasticsearch/data
    networks:
      - microservices-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5

  frontend-next:
    build:
      context: ./frontend-next
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=production
      - INGESTION_API_URL=http://ingestion-service:5000
    networks:
      - microservices-net
    restart: unless-stopped
    depends_on:
      - ingestion-service
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => { if (r.statusCode !== 200) process.exit(1); }).on('error', () => process.exit(1));"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend-admin:
    build:
      context: ./frontend-admin
      dockerfile: Dockerfile
    networks:
      - microservices-net
    restart: unless-stopped
    depends_on:
      - notification-service
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/index.html || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./config-prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config-prometheus/alerting-rules.yml:/etc/prometheus/alerting-rules.yml:ro
      - prometheus_data:/prometheus
    networks:
      - microservices-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-staging_grafana_pass_p14}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - microservices-net
    restart: unless-stopped
    depends_on:
      - prometheus

networks:
  microservices-net:
    driver: bridge

volumes:
  mongo_data:
  postgres_data:
  kafka_data:
  elastic_data:
  prometheus_data:
  grafana_data:
  user_storage:
  shared_uploads:
  scraper_data:
  notification_data:

