events {
    worker_connections 1024;
}

http {
    # Define our internal upstream services. 
    # The names must match the service names in docker-compose.
    upstream user_service {
        server user-service:3000; 
    }

    upstream resume_service {
        server resume-api:8000;
    }

    upstream notification_service {
        server notification-service:4000;
    }

    upstream ingestion_service {
        server ingestion-service:5000;
    }

    upstream frontend {
        server frontend-next:3000;
    }

    server {
        listen 80;
        server_name localhost;

        # Standard headers for proxying
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Route 1: Anything starting with /api/users goes to NestJS
        # e.g., /api/users/sync → user-service:3000/users/sync
        location /api/users/ {
            proxy_pass http://user_service/users/;
        }

        # Route 2: Anything starting with /api/resume goes to FastAPI
        # e.g., /api/resume/parse → resume-api:8000/parse
        location /api/resume/ {
            proxy_pass http://resume_service/;
            # Resume uploads might be large, so we increase the upload limit
            client_max_body_size 10M; 
        }

        # Route 3: MongoDB-backed Jobs API (used by external clients)
        # e.g., /api/jobs?q=React → ingestion-service:5000/api/jobs?q=React
        location /api/jobs/ {
            proxy_pass http://ingestion_service/api/jobs/;
        }

        # Route 4: Notification service health/metrics
        # e.g., /api/notifications/health → notification-service:4000/health
        location /api/notifications/ {
            proxy_pass http://notification_service/;
        }

        # Global fallback — all other paths go to the Next.js frontend
        # The frontend has its own /api/jobs route that uses Elasticsearch
        # for full-text search (server-side API route in Next.js)
        location / {
            proxy_pass http://frontend/;
        }
    }
}
