events {
    worker_connections 1024;
}

http {
    # Define our internal upstream services. 
    # The names must match the service names we will use in docker-compose later.
    # upstream user_service {
    #     server user-service:3000; 
    # }

    # upstream resume_service {
    #     server resume-service:8000;
    # }

    upstream notification_service {
        server notification-service:4000;
    }

    server {
        listen 80;
        server_name localhost;

        # Standard headers for proxying
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Route 1: Anything starting with /api/users goes to NestJS
        location /api/users/ {
            return 501 '{"error": "user_service not containerized yet"}';
            # proxy_pass http://user_service/;
        }

        # Route 2: Anything starting with /api/resume goes to FastAPI
        location /api/resume/ {
            return 501 '{"error": "resume_service not containerized yet"}';
            # proxy_pass http://resume_service/;
            # Resume uploads might be large, so we increase the upload limit
            client_max_body_size 10M; 
        }

        location /api/notifications/ {
            proxy_pass http://notification_service/;
        }

        # Global fallback (optional)
        location / {
            return 404 '{"error": "Service not found"}';
            default_type application/json;
        }
    }
}
