events {
    worker_connections 1024;
}

http {
    # Define our internal upstream services. 
    # The names must match the service names in docker-compose.
    upstream user_service {
        server user-service:3000; 
    }

    upstream resume_service {
        server resume-api:8000;
    }

    upstream notification_service {
        server notification-service:4000;
    }

    upstream ingestion_service {
        server ingestion-service:5000;
    }

    upstream frontend {
        server frontend-next:3000;
    }

    upstream admin_frontend {
        server frontend-admin:80;
    }

    server {
        listen 80;
        server_name localhost;

        # Allow 10MB uploads for resumes across endpoints
        client_max_body_size 10M;

        # Standard headers for proxying
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-ID $http_x_correlation_id;

        # Route 0: Authoritative Versioned API Routes (/api/v1/*)
        location /api/v1/jobs {
            proxy_pass http://ingestion_service;
        }

        location /api/v1/users/ {
            proxy_pass http://user_service/users/;
        }

        location /api/v1/resume/ {
            proxy_pass http://resume_service/;
        }

        location /api/v1/notifications/ {
            proxy_pass http://notification_service/;
        }

        # Route 1: User Service (NestJS) legacy path
        # e.g., /api/users/sync → user-service:3000/users/sync
        location /api/users/ {
            proxy_pass http://user_service/users/;
        }

        # Route 2: Resume Service (FastAPI) legacy path
        # e.g., /api/resume/parse → resume-api:8000/parse
        location /api/resume/ {
            proxy_pass http://resume_service/;
        }

        # Route 3: Jobs Ingestion & Search API legacy path
        # Handles both /api/jobs and /api/jobs/ with query parameters
        location /api/jobs {
            proxy_pass http://ingestion_service;
        }

        # Route 4: Notification Service health and metrics
        # e.g., /api/notifications/health → notification-service:4000/health
        location /api/notifications/ {
            proxy_pass http://notification_service/;
        }

        # Route 5: WebSocket Support for live notifications
        location /socket.io/ {
            proxy_pass http://notification_service/socket.io/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Route 6: Admin Dashboard (Angular)
        location /admin/ {
            proxy_pass http://admin_frontend/;
        }

        # Global fallback: Candidate App (Next.js)
        location / {
            proxy_pass http://frontend/;
        }
    }
}
