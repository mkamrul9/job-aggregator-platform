events {
    worker_connections 1024;
}

http {
    # Rate limiting zone for abusive or runaway callers
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=50r/s;

    # Correlation ID propagation: use incoming or generate unique request id
    map $http_x_correlation_id $correlation_id {
        default $http_x_correlation_id;
        ""      $request_id;
    }

    # Define our internal upstream services. 
    # The names must match the service names in docker-compose.
    upstream user_service {
        server user-service:3000; 
    }

    upstream resume_service {
        server resume-api:8000;
    }

    upstream notification_service {
        server notification-service:4000;
    }

    upstream ingestion_service {
        server ingestion-service:5000;
    }

    upstream frontend {
        server frontend-next:3000;
    }

    upstream admin_frontend {
        server frontend-admin:80;
    }

    server {
        listen 80;
        listen 443 ssl;
        server_name localhost seekers.local;

        # TLS Configuration
        ssl_certificate /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Allow 10MB uploads for resumes across endpoints
        client_max_body_size 10M;

        # Standard headers for proxying
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-ID $correlation_id;

        # Security Headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' http: https: ws: wss:;" always;

        # Upstream proxy timeouts
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 60s;

        # Gateway health check
        location = /health {
            default_type application/json;
            return 200 '{"status":"UP","service":"api-gateway","version":"1.0.0"}';
        }

        # Route 0: Authoritative Versioned API Routes (/api/v1/*)
        location /api/v1/jobs {
            limit_req zone=api_limit burst=100 nodelay;
            proxy_pass http://ingestion_service;
        }

        location /api/v1/users/ {
            limit_req zone=api_limit burst=100 nodelay;
            proxy_pass http://user_service/users/;
        }

        location /api/v1/resume/ {
            limit_req zone=api_limit burst=50 nodelay;
            proxy_pass http://resume_service/;
        }

        location /api/v1/notifications/ {
            limit_req zone=api_limit burst=100 nodelay;
            proxy_pass http://notification_service/;
        }

        location /api/v1/reports {
            limit_req zone=api_limit burst=30 nodelay;
            proxy_pass http://user_service/reports;
        }

        # Admin Operations Routes
        location /api/v1/admin/reports {
            proxy_pass http://user_service/admin/reports;
        }

        location /api/v1/admin/ingestion/ {
            proxy_pass http://ingestion_service/api/v1/admin/ingestion/;
        }

        location /api/v1/admin/ {
            proxy_pass http://ingestion_service/api/v1/admin/;
        }

        location /reports {
            proxy_pass http://user_service/reports;
        }

        # Route 1: User Service (NestJS) legacy path
        location /api/users/ {
            proxy_pass http://user_service/users/;
        }

        # Route 2: Resume Service (FastAPI) legacy path
        location /api/resume/ {
            proxy_pass http://resume_service/;
        }

        # Route 3: Jobs Ingestion & Search API legacy path
        location /api/jobs {
            proxy_pass http://ingestion_service;
        }

        # Route 4: Notification Service health and metrics
        location /api/notifications/ {
            proxy_pass http://notification_service/;
        }

        # Route 5: WebSocket Support for live notifications
        location /socket.io/ {
            proxy_pass http://notification_service/socket.io/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Route 6: Admin Dashboard (Angular)
        location = /admin {
            return 301 /admin/;
        }

        location /admin/ {
            proxy_pass http://admin_frontend/;
        }

        # Global fallback: Candidate App (Next.js)
        location / {
            proxy_pass http://frontend/;
        }
    }
}
