# docker-compose.yml
version: '3.8'

services:
  api-gateway:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - microservices-net
    depends_on:
      - scraper-service

  scraper-service:
    build: 
      context: ./service-scraper
      dockerfile: Dockerfile
    environment:
      - MONGO_URI=mongodb://job-mongo:27017
    networks:
      - microservices-net
    depends_on:
      - job-mongo

  job-mongo:
    image: mongo:latest
    ports:
      - "27017:27017" # Exposed only for local debugging/compass
    volumes:
      - mongo_data:/data/db
    networks:
      - microservices-net

  user-postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: job_aggregator_users
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - microservices-net

  user-service:
    build:
      context: ./service-user
      dockerfile: Dockerfile
    environment:
      # Use the container name 'user-postgres' to connect internally
      - DATABASE_URL=postgresql://admin:password123@user-postgres:5432/job_aggregator_users?schema=public
      # Point the gRPC client to the Python container's internal network address
      - RESUME_GRPC_URL=resume-service:50051 
    ports:
      - "3000:3000" # Optional: only expose if you want to bypass Nginx for debugging
    networks:
      - microservices-net
    depends_on:
      - user-postgres
      - resume-service

  resume-service:
    build:
      context: ./service-resume
      dockerfile: Dockerfile
    networks:
      - microservices-net

  kafka:
    image: bitnami/kafka:latest
    ports:
      - "9092:9092"
    environment:
      # Enable KRaft mode (no Zookeeper needed)
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@localhost:9093
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      # Allow services on the Docker network to connect
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092 
      # Auto-create topics when a publisher tries to write to them
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
    volumes:
      - kafka_data:/bitnami/kafka
    networks:
      - microservices-net

networks:
  microservices-net:
    driver: bridge

volumes:
  mongo_data:
  postgres_data:
  kafka_data:
