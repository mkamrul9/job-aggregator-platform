# docker-compose.yml
version: '3.8'

services:
  api-gateway:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - microservices-net
    depends_on:
      - scraper-service

  scraper-service:
    build: 
      context: ./service-scraper
      dockerfile: Dockerfile
    environment:
      # Pass the Kafka URL instead of Mongo URI
      - KAFKA_BROKER=kafka:9092
    networks:
      - microservices-net
    depends_on:
      - kafka # Now depends on Kafka, not job-mongo

  job-mongo:
    image: mongo:latest
    ports:
      - "27017:27017" # Exposed only for local debugging/compass
    volumes:
      - mongo_data:/data/db
    networks:
      - microservices-net

  user-postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: job_aggregator_users
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - microservices-net

  user-service:
    build:
      context: ./service-user
      dockerfile: Dockerfile
    environment:
      # Use the container name 'user-postgres' to connect internally
      - DATABASE_URL=postgresql://admin:password123@user-postgres:5432/job_aggregator_users?schema=public
      # Point the gRPC client to the Python container's internal network address
      - RESUME_GRPC_URL=resume-service:50051 
    ports:
      - "3000:3000" # Optional: only expose if you want to bypass Nginx for debugging
    volumes:
      - ./shared-protos:/shared-protos
    networks:
      - microservices-net
    depends_on:
      - user-postgres
      - resume-service

  resume-service:
    build:
      context: ./service-resume
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    networks:
      - microservices-net

  kafka:
    image: apache/kafka:latest
    user: root
    ports:
      - "9092:9092"
    environment:
      # Enable KRaft mode (no Zookeeper needed)
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      - KAFKA_NUM_PARTITIONS=1
    volumes:
      - kafka_data:/tmp/kafka-logs
    networks:
      - microservices-net

  ingestion-service:
    build:
      context: ./service-ingestion
      dockerfile: Dockerfile
    environment:
      - KAFKA_BROKER=kafka:9092
      - MONGO_URI=mongodb://job-mongo:27017
    networks:
      - microservices-net
    depends_on:
      - kafka
      - job-mongo

  notification-service:
    build:
      context: ./service-notification
      dockerfile: Dockerfile
    environment:
      - KAFKA_BROKER=kafka:9092
    networks:
      - microservices-net
    depends_on:
      - kafka

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.10.2
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      # Restrict JVM memory to 1GB to prevent system freezes
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "9200:9200"
    volumes:
      - elastic_data:/usr/share/elasticsearch/data
    networks:
      - microservices-net

networks:
  microservices-net:
    driver: bridge

volumes:
  mongo_data:
  postgres_data:
  kafka_data:
  elastic_data:
