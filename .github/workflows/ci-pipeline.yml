# .github/workflows/ci-pipeline.yml
name: Job Aggregator CI/CD

# Trigger the workflow on pushes to the main branch or on pull requests
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # -------------------------------------------------------------
  # JOB 1: Test the Golang Scraper
  # -------------------------------------------------------------
  test-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Run Go Unit Tests
        working-directory: ./service-scraper
        run: go test -v ./...

  # -------------------------------------------------------------
  # JOB 2: Test the FastAPI Resume Service
  # -------------------------------------------------------------
  test-ai-parser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        working-directory: ./service-resume
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m spacy download en_core_web_sm
          pip install pytest httpx

      - name: Run Pytest
        working-directory: ./service-resume
        run: pytest test_main.py

  # -------------------------------------------------------------
  # JOB 3: Test the NestJS User Service
  # -------------------------------------------------------------
  test-user-service:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies & Generate Prisma
        working-directory: ./service-user
        run: |
          npm ci
          npx prisma generate

      - name: Run Jest Unit Tests
        working-directory: ./service-user
        run: npm run test

  # -------------------------------------------------------------
  # JOB 4: Build Docker Images (Only runs if all tests pass)
  # -------------------------------------------------------------
  build-docker-images:
    needs: [test-scraper, test-ai-parser, test-user-service]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Using Docker Compose to verify all multi-stage builds complete successfully
      - name: Build All Services
        run: docker compose build
