# .github/workflows/ci-pipeline.yml
name: Job Aggregator CI/CD

# Trigger the workflow on pushes to main or codex feature branches, and pull requests to main
on:
  push:
    branches: [ "main", "codex/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # -------------------------------------------------------------
  # JOB 1: Test the Golang Scraper
  # -------------------------------------------------------------
  test-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Run Go Vet
        working-directory: ./service-scraper
        run: go vet ./...

      - name: Run Go Unit Tests
        working-directory: ./service-scraper
        run: go test -v ./...

  # -------------------------------------------------------------
  # JOB 2: Test the FastAPI Resume Service
  # -------------------------------------------------------------
  test-ai-parser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        working-directory: ./service-resume
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m spacy download en_core_web_sm
          pip install pytest httpx

      - name: Run Pytest
        working-directory: ./service-resume
        run: pytest test_main.py

  # -------------------------------------------------------------
  # JOB 3: Test the NestJS User Service
  # -------------------------------------------------------------
  test-user-service:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies & Generate Prisma
        working-directory: ./service-user
        run: |
          npm ci
          npx prisma generate

      - name: Run ESLint
        working-directory: ./service-user
        run: npm run lint

      - name: Run Jest Unit Tests
        working-directory: ./service-user
        run: npm run test

  # -------------------------------------------------------------
  # JOB 4: Test the Ingestion Service
  # -------------------------------------------------------------
  test-ingestion:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        working-directory: ./service-ingestion
        run: npm ci

      - name: Run Unit Tests
        working-directory: ./service-ingestion
        run: npm test

  # -------------------------------------------------------------
  # JOB 5: Test the Notification Service
  # -------------------------------------------------------------
  test-notification:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        working-directory: ./service-notification
        run: npm ci

      - name: Run Unit Tests
        working-directory: ./service-notification
        run: npm test

  # -------------------------------------------------------------
  # JOB 6: Test & Build Frontend Next.js
  # -------------------------------------------------------------
  test-frontend-next:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        working-directory: ./frontend-next
        run: npm ci

      - name: Run ESLint
        working-directory: ./frontend-next
        run: npm run lint

      - name: Build Next.js Application
        working-directory: ./frontend-next
        run: npm run build

  # -------------------------------------------------------------
  # JOB 7: Test & Build Frontend Admin (Angular)
  # -------------------------------------------------------------
  test-frontend-admin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        working-directory: ./frontend-admin
        run: npm ci

      - name: Build Angular Application
        working-directory: ./frontend-admin
        run: npm run build

  # -------------------------------------------------------------
  # JOB 8: Build Docker Images (Only runs if all 7 test suites pass)
  # -------------------------------------------------------------
  build-docker-images:
    needs:
      - test-scraper
      - test-ai-parser
      - test-user-service
      - test-ingestion
      - test-notification
      - test-frontend-next
      - test-frontend-admin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build All Services
        run: docker compose build
