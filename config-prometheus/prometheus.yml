# config-prometheus/prometheus.yml
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alerting-rules.yml

scrape_configs:
  - job_name: 'notification-service'
    static_configs:
      - targets: ['notification-service:4000']

  - job_name: 'ingestion-service'
    static_configs:
      - targets: ['ingestion-service:5000']

  - job_name: 'user-service'
    static_configs:
      - targets: ['user-service:3000']

  - job_name: 'resume-service'
    static_configs:
      - targets: ['resume-api:8000']
